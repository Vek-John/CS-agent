name: Bug 报告
description: 报告可复现的问题；不要附带 Demo、数据库、日志或 secret
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "请先脱敏。禁止附加 .dem、SQLite/backup、原始日志、Keychain 导出、API Key、token、用户记忆或完整本机路径。安全问题请使用私密漏洞报告。"
  - type: dropdown
    id: surface
    attributes:
      label: 影响范围
      options: ["macOS Desktop", "localhost 开发", "Cloudflare 兼容 adapter", "文档/发布工具"]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: 版本或 commit, placeholder: "例如 0.1.0 / commit SHA" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: 最小复现步骤 }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: 预期行为 }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: 实际行为与脱敏错误码 }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: "我没有附加 Demo、DB/backup、日志、secret/token、Keychain 内容、Memory 正文或完整本机路径。"
          required: true
