[package]
name = "cs-agent-desktop"
version = "0.1.0"
description = "Local-first CS Agent desktop supervisor"
edition = "2021"
rust-version = "1.77.2"
autobins = false
default-run = "cs-agent-desktop"

[lib]
name = "cs_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cs-agent-desktop"
path = "src/main.rs"

[[bin]]
name = "updater-signature-verify"
path = "src/bin/updater-signature-verify.rs"
required-features = ["release-verifier"]

[features]
release-verifier = []

[build-dependencies]
serde_json = "1"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
libc = "0.2"
cookie = "0.18"
base64 = "0.22"
flate2 = "1"
futures-util = "0.3"
minisign-verify = "0.2.5"
plist = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
security-framework = "=3.7.0"
tar = "0.4"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
